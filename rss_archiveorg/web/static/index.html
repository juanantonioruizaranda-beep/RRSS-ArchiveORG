<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS-ArchiveORG</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --panel-2: #243044;
      --text: #e7ecf3;
      --muted: #9aa8bc;
      --accent: #4f8cff;
      --accent-2: #36c2a5;
      --danger: #ff6b6b;
      --warn: #f0b429;
      --ok: #3ddc84;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79, 140, 255, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(54, 194, 165, 0.12), transparent 24%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    header {
      margin-bottom: 28px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: -0.03em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      backdrop-filter: blur(8px);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 6px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 14px;
      font: 0.95rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    textarea:focus {
      outline: 2px solid rgba(79, 140, 255, 0.35);
      border-color: rgba(79, 140, 255, 0.5);
    }

    .controls {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="range"] {
      flex: 1;
      min-width: 180px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #6aa8ff);
      color: white;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .progress {
      margin-bottom: 16px;
      display: none;
    }

    .progress.active { display: block; }

    .progress-bar {
      height: 10px;
      background: var(--panel-2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.25s ease;
    }

    .status-banner {
      display: none;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
    }

    .status-banner.show { display: block; }
    .status-banner.done { border-color: rgba(61, 220, 132, 0.35); color: #c9f7da; }
    .status-banner.error { border-color: rgba(255, 107, 107, 0.35); color: #ffd2d2; }

    .results {
      display: grid;
      gap: 14px;
      max-height: 72vh;
      overflow: auto;
      padding-right: 4px;
    }

    .result {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      background: var(--panel);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 10px;
    }

    .result-head h3 {
      margin: 0;
      font-size: 1rem;
      word-break: break-all;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 6px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .badge.ok { background: rgba(61, 220, 132, 0.15); color: var(--ok); }
    .badge.empty { background: rgba(240, 180, 41, 0.15); color: var(--warn); }
    .badge.error { background: rgba(255, 107, 107, 0.15); color: var(--danger); }

    .section-title {
      margin: 12px 0 6px;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .links, .emails {
      margin: 0;
      padding-left: 18px;
      color: #d7e2f1;
    }

    .links li, .emails li { margin: 4px 0; word-break: break-all; }

    .notice {
      color: var(--warn);
      margin: 0;
    }

    .error-text {
      color: #ffb4b4;
      margin: 0;
    }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 40px 12px;
    }

    a { color: #9ec5ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>RSS-ArchiveORG</h1>
      <p>
        Extrae redes sociales y correos corporativos desde snapshots de
        <a href="https://web.archive.org/" target="_blank" rel="noreferrer">archive.org</a>.
        Añade entre 1 y 200 URLs, configura la espera entre peticiones y lanza el lote.
      </p>
    </header>

    <div class="grid">
      <section class="card">
        <label for="urls">URLs (una por línea)</label>
        <textarea id="urls" placeholder="https://ejemplo.com&#10;https://otra-web.es"></textarea>
        <p class="hint" id="url-count">0 URLs · máximo 200</p>

        <div class="controls">
          <div>
            <label for="delay">Espera entre peticiones: <span id="delay-value">5</span>s</label>
            <div class="row">
              <input id="delay" type="range" min="3" max="30" step="0.5" value="5">
              <span class="pill">Mínimo recomendado: 3s</span>
            </div>
          </div>

          <label class="checkbox">
            <input id="use-proxies" type="checkbox">
            <span>Usar proxys (<code>proxies.txt</code>)</span>
          </label>
          <p class="hint" id="proxy-hint"></p>

          <button id="submit" type="button">Enviar petición</button>
        </div>
      </section>

      <section class="card">
        <div class="progress" id="progress">
          <strong id="progress-label">Procesando…</strong>
          <div class="progress-bar"><span id="progress-bar"></span></div>
        </div>

        <div class="status-banner" id="status-banner"></div>

        <div class="results" id="results">
          <div class="empty-state">Los resultados aparecerán aquí en tiempo real.</div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const urlsInput = document.getElementById("urls");
    const urlCount = document.getElementById("url-count");
    const delayInput = document.getElementById("delay");
    const delayValue = document.getElementById("delay-value");
    const useProxiesInput = document.getElementById("use-proxies");
    const proxyHint = document.getElementById("proxy-hint");
    const submitBtn = document.getElementById("submit");
    const resultsEl = document.getElementById("results");
    const progressEl = document.getElementById("progress");
    const progressLabel = document.getElementById("progress-label");
    const progressBar = document.getElementById("progress-bar");
    const statusBanner = document.getElementById("status-banner");

    let running = false;

    function countUrls(text) {
      return text
        .split("\n")
        .map((line) => line.trim())
        .filter((line) => line && !line.startsWith("#")).length;
    }

    function updateUrlCount() {
      const count = countUrls(urlsInput.value);
      urlCount.textContent = `${count} URL${count === 1 ? "" : "s"} · máximo 200`;
      urlCount.style.color = count > 200 ? "#ffb4b4" : "";
    }

    function setRunning(active) {
      running = active;
      submitBtn.disabled = active;
      urlsInput.disabled = active;
      delayInput.disabled = active;
      useProxiesInput.disabled = active;
      progressEl.classList.toggle("active", active);
    }

    function showBanner(message, kind) {
      statusBanner.textContent = message;
      statusBanner.className = `status-banner show ${kind || ""}`;
    }

    function clearResults() {
      resultsEl.innerHTML = "";
    }

    function warningText(code) {
      if (code === "no_rrss") return "No se encontraron redes sociales.";
      if (code === "no_email") return "No se encontró correo electrónico.";
      return code;
    }

    function renderResult(data) {
      const card = document.createElement("article");
      card.className = "result";

      const statusLabel = data.status === "ok" ? "Con datos" : data.status === "empty" ? "Sin datos" : "Error";
      const badgeClass = data.status;

      let body = "";

      if (data.error) {
        body += `<p class="error-text">${escapeHtml(data.error)}</p>`;
      }

      if (data.warnings && data.warnings.length) {
        body += `<ul class="notice">${data.warnings.map((w) => `<li>${escapeHtml(warningText(w))}</li>`).join("")}</ul>`;
      }

      const socialEntries = Object.entries(data.social || {});
      if (socialEntries.length) {
        body += `<div class="section-title">Redes sociales</div>`;
        for (const [network, links] of socialEntries) {
          body += `<div><strong>${escapeHtml(network)}</strong><ul class="links">${links.map((link) => `<li><a href="${escapeAttr(link)}" target="_blank" rel="noreferrer">${escapeHtml(link)}</a></li>`).join("")}</ul></div>`;
        }
      }

      if (data.corporate_emails && data.corporate_emails.length) {
        body += `<div class="section-title">Correos corporativos</div><ul class="emails">${data.corporate_emails.map((email) => `<li>${escapeHtml(email)}</li>`).join("")}</ul>`;
      }

      if (data.all_emails && data.all_emails.length) {
        body += `<div class="section-title">Otros correos detectados</div><ul class="emails">${data.all_emails.map((email) => `<li>${escapeHtml(email)}</li>`).join("")}</ul>`;
      }

      if (data.snapshot) {
        body += `<p class="hint">Snapshot: ${escapeHtml(data.snapshot.timestamp)} · <a href="${escapeAttr(data.snapshot.url)}" target="_blank" rel="noreferrer">ver en archive.org</a></p>`;
      }

      card.innerHTML = `
        <div class="result-head">
          <h3>${escapeHtml(data.site)}</h3>
          <span class="badge ${badgeClass}">${statusLabel}</span>
        </div>
        ${body}
      `;

      resultsEl.prepend(card);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("'", "&#39;");
    }

    async function loadConfig() {
      const response = await fetch("/api/config");
      const config = await response.json();
      delayInput.min = String(config.min_delay);
      delayInput.value = String(config.default_delay);
      delayValue.textContent = String(config.default_delay);
      proxyHint.textContent = config.proxies_available
        ? "Archivo proxies.txt detectado."
        : "No hay proxies.txt. Crea uno a partir de proxies.example.txt si quieres rotación.";
      if (!config.proxies_available) {
        useProxiesInput.disabled = true;
      }
    }

    async function submitJob() {
      const count = countUrls(urlsInput.value);
      if (count < 1) {
        showBanner("Añade al menos una URL.", "error");
        return;
      }
      if (count > 200) {
        showBanner("El máximo es 200 URLs por petición.", "error");
        return;
      }

      clearResults();
      showBanner("", "");
      statusBanner.className = "status-banner";
      setRunning(true);
      progressBar.style.width = "0%";
      progressLabel.textContent = "Iniciando…";

      const response = await fetch("/api/extract", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          urls_text: urlsInput.value,
          delay: Number(delayInput.value),
          use_proxies: useProxiesInput.checked,
        }),
      });

      if (!response.ok) {
        let message = "No se pudo iniciar la petición.";
        try {
          const payload = await response.json();
          if (payload.detail) message = payload.detail;
        } catch (_) {}
        showBanner(message, "error");
        setRunning(false);
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary = buffer.indexOf("\n\n");
        while (boundary !== -1) {
          const chunk = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const line = chunk.split("\n").find((entry) => entry.startsWith("data: "));
          if (line) {
            const payload = JSON.parse(line.slice(6));
            handleEvent(payload);
          }
          boundary = buffer.indexOf("\n\n");
        }
      }

      setRunning(false);
    }

    function handleEvent(payload) {
      if (payload.type === "result") {
        renderResult(payload);
        const pct = Math.round((payload.index / payload.total) * 100);
        progressBar.style.width = `${pct}%`;
        progressLabel.textContent = `Procesando ${payload.index} de ${payload.total}`;
        return;
      }

      if (payload.type === "done") {
        progressBar.style.width = "100%";
        progressLabel.textContent = "Completado";
        showBanner(`✅ ${payload.message}. ${payload.total} sitio(s) procesados.`, "done");
        return;
      }

      if (payload.type === "fatal") {
        showBanner(`Error fatal: ${payload.message}`, "error");
      }
    }

    urlsInput.addEventListener("input", updateUrlCount);
    delayInput.addEventListener("input", () => {
      delayValue.textContent = delayInput.value;
    });
    submitBtn.addEventListener("click", submitJob);

    loadConfig().then(updateUrlCount);
  </script>
</body>
</html>
